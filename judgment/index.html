<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="dark" />
  <title>Support System (prototype)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header class="top">
      <span class="brand" id="brand"></span>
      <span class="sub" id="sub"></span>
    </header>

    <div id="log" class="log" role="log" aria-live="polite" aria-label="Situation log"></div>

    <section id="controls" class="controls" aria-label="Actions"></section>

    <footer class="foot" id="foot"></footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
